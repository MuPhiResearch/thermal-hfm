name: docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer run supersede an in-flight one, but never cancel a live deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install Sphinx
        run: pip install -r docs/requirements.txt

      # -W turns warnings into errors so broken references fail the build
      # rather than shipping quietly.
      - name: Build HTML
        run: |
          sphinx-build -b html -W --keep-going docs docs/_build/html
          touch docs/_build/html/.nojekyll

      # Always available as a downloadable zip from the run summary, so the
      # docs can be reviewed while the repository is still private.
      - name: Upload docs as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: html-docs
          path: docs/_build/html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  # Publishing is off until the repository variable PUBLISH_PAGES is set to
  # 'true'. GitHub cannot serve an access-controlled Pages site from a personal
  # account, so the site stays unpublished while the repository is private.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && vars.PUBLISH_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
